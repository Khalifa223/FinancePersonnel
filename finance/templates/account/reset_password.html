{% extends 'finance.html' %}

{% block content %}
<div class="container">
    <h2>Réinitialiser le mot de passe</h2>
    <p>Saisissez votre adresse e-mail ci-dessous et nous vous enverrons les instructions pour réinitialiser votre mot de passe.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Envoyer le lien de réinitialisation</button>
    </form>
</div>
{% endblock %}
