{% extends 'finance.html' %}

{% block content %}
<div class="container">
    <h2>Entrez le nouveau mot de passe</h2>

    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Réinitialiser le mot de passe</button>
    </form>
    {% else %}
    <p>Le lien de réinitialisation du mot de passe est invalide ou a expiré. Veuillez en demander un nouveau.</p>
    {% endif %}
</div>
{% endblock %}
